<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc">
  <title id="title">Thido Instagram story mark</title>
  <desc id="desc">A centered green football pitch icon with a white letter T, sized for Instagram stories.</desc>
  <defs>
    <linearGradient id="background" x1="120" y1="0" x2="960" y2="1920" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbfffc"/>
      <stop offset="1" stop-color="#dff8e9"/>
    </linearGradient>
    <linearGradient id="mark-bg" x1="540" y1="670" x2="540" y2="1250" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#13985c"/>
      <stop offset="1" stop-color="#065f35"/>
    </linearGradient>
    <filter id="mark-shadow" x="190" y="622" width="700" height="776" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="54" stdDeviation="42" flood-color="#064e3b" flood-opacity=".24"/>
    </filter>
  </defs>

  <rect width="1080" height="1920" fill="url(#background)"/>
