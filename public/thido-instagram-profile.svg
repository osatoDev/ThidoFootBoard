    <path d="M466 401h149v40h-55v238h-45V441h-49z" fill="#fff"/>
    <path d="M456 421c0-11 9-20 20-20h129c11 0 20 9 20 20v5H456z" fill="#fff" opacity=".22"/>
    <path d="M456 540h168" fill="none" stroke="#fff" stroke-linecap="round" stroke-opacity=".32" stroke-width="15"/>
    <path d="M500 366v347M580 366v347" fill="none" stroke="#fff" stroke-linecap="round" stroke-opacity=".32" stroke-width="10"/>
